name: Balance Sync (3x Daily)

on:
  schedule:
    - cron: "15 0 * * *"   # 6:00 AM Nepal (00:15 UTC)
    - cron: "45 8 * * *"   # 2:30 PM Nepal (08:45 UTC)
    - cron: "15 15 * * *"  # 9:00 PM Nepal (15:15 UTC)
  workflow_dispatch:

jobs:
  sync-balances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r auto_sync/requirements.txt
      - name: Sync balances
        env:
          BINANCE_API_KEY:             ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET:          ${{ secrets.BINANCE_API_SECRET }}
          GOOGLE_SHEET_ID:             ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_TAB:                   ${{ secrets.SHEET_TAB }}
        run: python auto_sync/sync.py
